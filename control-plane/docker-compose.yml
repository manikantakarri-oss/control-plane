# Local stack: Postgres + the Control Plane container.
#   cp .env.example .env     # then set ADMIN_API_KEY
#   docker compose up --build
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: controlplane
      POSTGRES_PASSWORD: controlplane
      POSTGRES_DB: controlplane
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U controlplane"]
      interval: 5s
      retries: 10

  control-plane:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://controlplane:controlplane@postgres:5432/controlplane
    ports:
      - "8001:8000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:

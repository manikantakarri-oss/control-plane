# Databricks App manifest for Agent Portal (the Data Plane).
#
# The runtime injects DATABRICKS_HOST / DATABRICKS_CLIENT_ID /
# DATABRICKS_CLIENT_SECRET (the app's service principal) and forwards each
# signed-in user's OAuth token as X-Forwarded-Access-Token. The portal uses the
# user token for every agent invocation, so Databricks enforces access itself.
#
# user_api_scopes and the app resources referenced below are declared in the
# bundle (../databricks.yml), which applies them to the app record. Scopes in
# this file are not reliably applied by the runtime, so they are not listed here.

command:
  - uvicorn
  - app:app
  - --host
  - "0.0.0.0"
  - --port
  - "8000"

env:
  - name: APP_VERSION
    value: "1.0.0"
  - name: LOG_LEVEL
    value: "INFO"
  # Outbound-only reporting to the provider Control Plane: one JSON document
  # (see control_plane.py) from a secret resource on the app (databricks.yml).
  # It lives in the customer's own scope, written by scripts/provision-credentials.sh.
  - name: CONTROL_PLANE_CONFIG
    valueFrom: control-plane
